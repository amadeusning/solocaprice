<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkham Horror · Night of the Zealot</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Libre Baskerville covers Latin — CJK falls through to Noto Serif SC */
@font-face {
  font-family: 'Libre Baskerville';
  src: local('Libre Baskerville');
  unicode-range: U+0020-007F, U+00A0-00FF, U+2000-206F, U+2E00-2E7F, U+3000-303F;
}
</style>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1208;--p:#f5edd8;--p2:#ede0c0;--red:#8b1a1a;
  --gold:#a07c2a;--muted:#5c4a2a;--bdr:#c4a96b;--ok:#2d5a1b;
  --card:rgba(245,237,216,0.97);
  --body-font:'Libre Baskerville','Noto Serif SC',serif;
}
body{
  font-family:var(--body-font);
  background:#0d0a05;min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;
  padding:1.2rem 0.8rem;
  font-size:14px;line-height:1.9;color:var(--ink);
}
#app{width:100%;max-width:860px;background:var(--p);border:2px solid var(--bdr);border-radius:4px;overflow:hidden;box-shadow:0 8px 48px rgba(0,0,0,.8)}

/* Header */
.hdr{text-align:center;padding:1.4rem 1rem 1rem;border-bottom:2px solid var(--bdr);background:linear-gradient(180deg,#f0e4c8,var(--p))}
.hdr::before{content:'✦   ✦   ✦';display:block;font-size:10px;color:var(--gold);letter-spacing:10px;margin-bottom:6px}
.hdr h1{font-family:'Cinzel',serif;font-size:22px;color:var(--red);letter-spacing:4px;font-weight:600}
.hdr-sub{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.lang-toggle{display:flex;border:1px solid var(--bdr);border-radius:3px;overflow:hidden}
.lang-btn{font-family:'Cinzel',serif;font-size:11px;padding:4px 12px;cursor:pointer;color:var(--muted);background:var(--card);border:none;transition:all .15s;letter-spacing:.5px}
.lang-btn.active{background:var(--red);color:#f5edd8}

/* Tabs */
.tabs{display:flex;border-bottom:2px solid var(--bdr);background:var(--p2)}
.tab{font-family:'Cinzel',serif;font-size:12px;padding:9px 16px;cursor:pointer;color:var(--muted);border:none;background:transparent;border-bottom:3px solid transparent;margin-bottom:-2px;letter-spacing:.5px;transition:all .2s;display:flex;align-items:center;gap:5px}
.tab.active{color:var(--red);border-bottom-color:var(--red);font-weight:600}
.tab:hover:not(.active){color:var(--gold);background:rgba(160,124,42,.08)}
.panel{display:none;padding:1.2rem}
.panel.active{display:block}

/* Scenario nav */
.sc-nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:1.2rem}
.sc-btn{font-family:'Cinzel',serif;font-size:11px;padding:5px 13px;border:1px solid var(--bdr);background:var(--card);color:var(--muted);cursor:pointer;border-radius:3px;transition:all .2s;letter-spacing:.3px}
.sc-btn:hover{background:var(--p2);color:var(--red);border-color:var(--red)}
.sc-btn.active{background:var(--red);color:#f5edd8;border-color:var(--red)}
.sc-btn.done{border-color:var(--ok);color:var(--ok)}
.sc-btn.done.active{background:var(--ok);color:#f5edd8;border-color:var(--ok)}

/* Card */
.scard{background:var(--card);border:1px solid var(--bdr);border-radius:4px;padding:1.2rem;margin-bottom:1rem}
.stitle{font-family:'Cinzel',serif;font-size:16px;color:var(--red);margin-bottom:1rem;font-weight:600}

/* Section divider */
.slabel{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.slabel::before,.slabel::after{content:'';flex:1;height:.5px;background:var(--bdr)}

/* English words inside Chinese text */
.en-term{font-family:'Cinzel',serif;font-size:0.92em;letter-spacing:0.02em}

/* Encounter set badges */
.enc-sets{display:flex;flex-wrap:wrap;gap:5px;margin:.3em 0 .5em}
.enc{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:3px;
  background:rgba(139,26,26,.06);border:.5px solid rgba(139,26,26,.22);font-size:11.5px;color:var(--ink);white-space:nowrap}
.enc-img{width:20px;height:20px;object-fit:contain;flex-shrink:0;opacity:.88}
.enc-name{font-weight:600;color:var(--red);font-size:11.5px}
.enc-zh{color:var(--muted);font-size:10.5px}

/* TTS bar */
.tts-bar{display:flex;gap:8px;align-items:center;margin-bottom:1.2rem;padding:8px 10px;background:rgba(160,124,42,.07);border-radius:4px;border:.5px solid var(--bdr);flex-wrap:wrap}
.tts-label{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);letter-spacing:.5px}
.tts-sel{font-family:'Cinzel',serif;font-size:11px;padding:5px 7px;border:1px solid var(--bdr);background:var(--card);color:var(--muted);border-radius:3px;cursor:pointer}
.play-btn{font-family:'Cinzel',serif;font-size:11px;padding:5px 13px;border:1px solid var(--bdr);background:var(--card);color:var(--muted);cursor:pointer;border-radius:3px;display:flex;align-items:center;gap:5px;transition:all .2s}
.play-btn:hover{background:var(--p2);color:var(--red)}
.play-btn.playing{background:var(--red);color:#f5edd8;border-color:var(--red)}

/* Official text */
.official-block{background:rgba(255,255,255,.4);border-radius:4px;padding:1rem;border:.5px solid var(--bdr);margin-bottom:1rem}
.official-label{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.official-text{font-size:14px;line-height:2;color:var(--ink)}
.official-text p{margin-bottom:.85em}
.official-text p:last-child{margin-bottom:0}
.official-text strong{font-weight:600}

/* Setup */
.setup-box{background:rgba(160,124,42,.06);border-radius:4px;padding:.9rem 1rem;border:.5px dashed var(--bdr);margin-bottom:1rem}
.setup-box ul{list-style:none;margin:0;padding:0}
.setup-box li{font-size:13.5px;line-height:1.85;color:var(--ink);margin-bottom:.5em;padding-left:1.5em;position:relative}
.setup-box li:last-child{margin-bottom:0}
.setup-box li::before{content:'◆';position:absolute;left:0;color:var(--gold);font-size:8px;top:.5em}

/* Resolutions */
.csec{margin-top:1.2rem}
.clist{display:flex;flex-direction:column;gap:9px}
.cbtn{text-align:left;padding:12px 14px;border:1px solid var(--bdr);background:var(--card);border-radius:4px;cursor:pointer;transition:all .2s;width:100%}
.cbtn:hover{border-color:var(--red);background:var(--p2)}
.cbtn.sel{border-color:var(--ok);background:rgba(45,90,27,.05)}
.cbtn.sel .cid{color:var(--ok)}
.cid{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);letter-spacing:.5px;margin-bottom:7px}
.cnarr{font-size:14px;color:var(--ink);line-height:2;margin-bottom:8px}
.ceff{font-size:13px;color:var(--muted);line-height:1.8;border-top:.5px solid var(--bdr);padding-top:8px}
.ceff ul{list-style:none;margin:0;padding:0}
.ceff li{margin-bottom:.3em;padding-left:1.4em;position:relative}
.ceff li:last-child{margin-bottom:0}
.ceff li::before{content:'◆';position:absolute;left:0;color:var(--gold);font-size:8px;top:.45em}

/* Outcome box */
.obox{margin-top:1rem;padding:1rem;border:1px solid var(--gold);border-radius:4px;background:rgba(160,124,42,.07)}
.otitle{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.onarr{font-size:14px;line-height:2;color:var(--ink);margin-bottom:.8rem}
.oeff{font-size:13px;color:var(--muted);line-height:1.8}
.oeff ul{list-style:none;margin:0;padding:0}
.oeff li{margin-bottom:.3em;padding-left:1.4em;position:relative}
.oeff li::before{content:'◆';position:absolute;left:0;color:var(--gold);font-size:8px;top:.45em}
.nbtn{margin-top:12px;font-family:'Cinzel',serif;font-size:12px;padding:7px 18px;border:1px solid var(--red);background:transparent;color:var(--red);border-radius:3px;cursor:pointer;transition:all .2s}
.nbtn:hover{background:var(--red);color:#f5edd8}

/* Progress */
.pbwrap{margin-bottom:1.2rem}
.pblabel{font-family:'Cinzel',serif;font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.5px}
.pb{height:5px;background:var(--p2);border-radius:3px;overflow:hidden;border:.5px solid var(--bdr)}
.pbf{height:100%;background:var(--red);border-radius:3px;transition:width .5s}

/* Log */
.lctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
.linput{flex:1;min-width:160px;font-family:var(--body-font);font-size:13px;padding:7px 10px;border:1px solid var(--bdr);background:var(--card);border-radius:3px;color:var(--ink)}
.linput:focus{outline:none;border-color:var(--gold)}
.ladd{font-family:'Cinzel',serif;font-size:11px;padding:7px 16px;border:1px solid var(--red);background:var(--red);color:#f5edd8;border-radius:3px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.ladd:hover{background:#6b1212}
.lsel{font-family:'Cinzel',serif;font-size:11px;padding:7px 8px;border:1px solid var(--bdr);background:var(--card);color:var(--muted);border-radius:3px}
.lentry{background:var(--card);border:.5px solid var(--bdr);border-radius:4px;padding:8px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.letxt{font-size:13px;color:var(--ink);line-height:1.7;flex:1}
.lemeta{font-size:11px;color:var(--muted);white-space:nowrap;font-style:italic;flex-shrink:0}
.ldel{font-size:13px;cursor:pointer;color:var(--muted);padding:0 4px;background:none;border:none;flex-shrink:0}
.ldel:hover{color:var(--red)}
.lbadge{font-size:10px;padding:2px 7px;border-radius:10px;margin-right:6px;font-family:'Cinzel',serif;display:inline-block}
.bc{background:#e0eed4;color:#2d5a1b}.be{background:#f0dada;color:#8b1a1a}
.bch{background:#f0e8d0;color:#7a5520}.bn{background:#e4e0f0;color:#4a3a7a}
.elog{text-align:center;color:var(--muted);font-size:13px;padding:2.5rem 0}

/* Reference */
.or{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:.5px solid var(--bdr)}
.or:last-child{border-bottom:none}
.cnotes{display:flex;flex-direction:column;gap:6px;margin-top:.6rem}
.cnote{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;background:rgba(255,255,255,.3);border-radius:3px;border:.5px solid var(--bdr)}
.cnote input[type=checkbox]{accent-color:var(--red);width:14px;height:14px;cursor:pointer;flex-shrink:0;margin-top:3px}
.cnote label{font-size:13px;color:var(--ink);line-height:1.6;cursor:pointer}
.cnote.checked label{text-decoration:line-through;color:var(--muted)}
.exp-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.exp-label{font-size:13px;color:var(--muted);min-width:90px}
.exp-num{font-family:'Cinzel',serif;font-size:16px;color:var(--red);min-width:24px;text-align:center}
.exp-btn{font-family:'Cinzel',serif;font-size:14px;padding:2px 10px;border:1px solid var(--bdr);background:var(--card);color:var(--muted);cursor:pointer;border-radius:3px;line-height:1.4}
.exp-btn:hover{background:var(--p2);color:var(--red)}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <h1>ARKHAM HORROR</h1>
    <div class="hdr-sub">
      <span id="hdr-subtitle">Night of the Zealot · Campaign Companion</span>
      <div class="lang-toggle">
        <button class="lang-btn active" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('zh')">中文</button>
      </div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('story')"><span class="t" data-en="Story" data-zh="剧情">Story</span></button>
    <button class="tab" onclick="switchTab('log')"><span class="t" data-en="Log" data-zh="日志">Log</span></button>
    <button class="tab" onclick="switchTab('ref')"><span class="t" data-en="Reference" data-zh="参考">Reference</span></button>
  </div>

  <div id="tab-story" class="panel active">
    <div class="sc-nav" id="sc-nav"></div>
    <div id="sc-content"></div>
  </div>

  <div id="tab-log" class="panel">
    <div class="lctrl">
      <select class="lsel" id="lcat">
        <option value="c" class="t" data-en="Clue" data-zh="线索">Clue</option>
        <option value="e" class="t" data-en="Event" data-zh="事件">Event</option>
        <option value="ch" class="t" data-en="Chaos" data-zh="混乱">Chaos</option>
        <option value="n" class="t" data-en="Note" data-zh="备注">Note</option>
      </select>
      <input class="linput" id="linput" onkeydown="if(event.key==='Enter')addLog()"/>
      <button class="ladd" onclick="addLog()">+ <span class="t" data-en="Add" data-zh="记录">Add</span></button>
    </div>
    <div id="llist"><div class="elog" id="elog-empty">No entries yet. Start playing and log here!</div></div>
  </div>

  <div id="tab-ref" class="panel">
    <div class="scard" style="margin-bottom:1rem">
      <div class="stitle"><span class="t" data-en="Chaos Bag" data-zh="混沌袋">Chaos Bag</span></div>
      <div class="ssub"><span class="t" data-en="Night of the Zealot — All Difficulties" data-zh="狂热者之夜 — 全难度对照">Night of the Zealot — All Difficulties</span></div>

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach((b,i) => b.classList.toggle('active', ['en','zh'][i] === l));
  // Update all static .t spans
  document.querySelectorAll('.t').forEach(el => {
    el.textContent = el.dataset[l] || el.textContent;
  });
  // Update dynamic content — use ?. so missing elements never throw
  const hdrSub = document.getElementById('hdr-subtitle');
  if(hdrSub) hdrSub.textContent = l === 'zh' ? '狂热者之夜 · 官方战役指南' : 'Night of the Zealot · Campaign Companion';
  const elogEmpty = document.getElementById('elog-empty');
  if(elogEmpty) elogEmpty.textContent = l === 'zh' ? '尚无日志。开始冒险后在这里记录！' : 'No entries yet. Start playing and log here!';
  const linput = document.getElementById('linput');
  if(linput) linput.placeholder = l === 'zh' ? '记录游戏事件、线索、决定……' : 'Log events, clues, decisions…';
  renderNav(); renderSc(); renderLog(); 
  // Only re-render ref elements if that tab is active
  if(document.getElementById('tab-ref').classList.contains('active')){
    setBag(currentBag); renderNotes(); renderExp(); renderOutcomes();
  }
}

导言一：那女子惊慌失措地找到你们，喋喋不休地诉说着怪物从河镇附近一所民宅的地下破土而出的事情。「我设法将它们困住了，」她解释道，「但还有其他的。其他的坑穴。其他的领域。」就在上周，你还会以为她是个疯子。然而，近来发生的事情已经颠覆了你对正常的既有认知。你决定听她把话说完。

她自我介绍叫莉塔·尚特勒，随后娓娓道出一段几乎超出你所能相信的极限的故事。「我所说的那些生物，」她声称，「被称为食尸鬼——残忍的存在，盘踞于阿卡姆城地下的墓穴、洞窟与隧道之中……」

导言二：在你家遭遇那场灾难之后，客厅里的那位红发女子莉塔·尚特勒，向你们娓娓道出一段故事——即便在你亲眼目睹了那一切之后，这段故事仍几乎超出你所能相信的极限。「出现在你家中的那些生物，」她声称，「被称为食尸鬼——残忍的存在，盘踞于阿卡姆城地下的墓穴、洞窟与隧道之中……」

导言三（两者皆适用）：「这些生物以人类的尸体为食，它们由阿卡姆城内一个黑暗的邪教所驱使——邪教成员莫名其妙地开始崇拜食尸鬼的古老主宰。这个邪教一直在杀害无辜的人，将他们喂给食尸鬼，以此满足一种可怖的饥渴。一种黑暗的平衡就此维持。直到现在。最近，」莉塔继续说，「他们的一处巢穴——存放尸体之所——遭到摧毁。自那以后，食尸鬼比以往更加活跃。我一直追踪它们的动向，竭尽全力阻止它们在全城肆虐。但我认为，有更糟糕的事情正在发生。这个邪教一直在筹谋某件比我迄今所见的一切都更加黑暗、更加不祥的事情。种种迹象表明，这个计划将在今晚午夜过后不久付诸实施。除此之外，我无法预料会发生什么。

「邪教中的许多人，」莉塔继续说，「看起来与普通人无异，尽管他们心怀邪恶的图谋。每当邪教集会时，成员们便会戴上以各种动物骷髅为造型的面具，以此相互隐匿身份。这些面具，就是我们的标记。死亡与腐朽的象征。我们必须揭开信徒的面具，曝光并打乱他们的计划。我们只有几个小时的时间。在午夜到来之前找到的信徒越多，胜算就越大。」`

// ─── State ───────────────────────────────────────────────────────────────────
let curSc=0, scStep=0, chosen={}, logs=[], notesState={}, expState={p1:0,p2:0,p3:0,p4:0};


// ─── Tabs ────────────────────────────────────────────────────────────────────
function switchTab(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['story','log','ref'][i]===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  if(t==='ref'){renderNotes();renderExp();renderOutcomes();}
}

// ─── Scenario nav ─────────────────────────────────────────────────────────────
function renderNav(){
  document.getElementById('sc-nav').innerHTML=SC.map((s,i)=>{
    const d=chosen[s.id];
    return`<button class="sc-btn ${i===curSc?'active':''} ${d?'done':''}" onclick="gotoSc(${i})">${s.label[lang]}${d?' ✓':''}</button>`;
  }).join('');
}
function gotoSc(i){curSc=i;scStep=chosen[SC[i].id]?2:0;renderNav();renderSc();}

// ─── Intro formatter ─────────────────────────────────────────────────────────
function fmtIntro(txt, scId){
  // For scenario 2: show only the relevant intro based on campaign log
  if(scId === 'sc2'){
    const litaAlone = notesState['lita_alone'];
    return fmtSc2Intro(txt, litaAlone);
  }
  return fmtParas(txt);
}

function fmtSc2Intro(txt, litaAlone){
  const paras = txt.split(/\n\n|\\n\\n/).map(p=>p.trim()).filter(Boolean);
  // Identify which paragraphs belong to which section
  // Structure: [condition note], Intro1 paras..., Intro2 para, Intro3 paras...
  // We show: condition note + relevant intro (1 or 2) + Intro 3
  const isEn = lang === 'en';
  const intro1Marker = isEn ? 'Intro 1:' : '导言一：';
  const intro2Marker = isEn ? 'Intro 2:' : '导言二：';
  const intro3Marker = isEn ? 'Intro 3' : '导言三';

  let sections = {pre:[], intro1:[], intro2:[], intro3:[]};
  let cur = 'pre';
  for(const p of paras){
    if(p.startsWith('[') || p.startsWith('【')){ sections.pre.push(p); continue; }
    if(p.startsWith(intro1Marker)||p.includes(intro1Marker.slice(0,6))) cur='intro1';
    else if(p.startsWith(intro2Marker)||p.includes(intro2Marker.slice(0,6))) cur='intro2';
    else if(p.startsWith(intro3Marker)||p.includes(intro3Marker.slice(0,6))) cur='intro3';
    sections[cur].push(p);
  }

  // Pick intro1 or intro2 based on campaign log
  const chosen = litaAlone ? sections.intro1 : sections.intro2;
  const all = [...chosen, ...sections.intro3];

  return all.map(p=>{
    p=p.replace(/^(Intro [123][^:]*:)/,'<strong>$1</strong>');
    p=p.replace(/^(导言[一二三四][^：]*：)/,'<strong>$1</strong>');
    return`<p>${p}</p>`;
  }).join('');
}

function fmtParas(txt){
  return txt.split(/\n\n|\\n\\n/).map(p=>{
    p=p.trim();if(!p)return'';
    if(p.startsWith('[')||p.startsWith('【'))
      return`<p style="font-style:italic;color:var(--muted);font-size:12.5px">${p}</p>`;
    if(lang==='en') p=p.replace(/^(Intro \d+[^:]*:)/,'<strong>$1</strong>');
    if(lang==='zh') p=p.replace(/^(导言[一二三四][^：]*：)/,'<strong>$1</strong>');
    return`<p>${p}</p>`;
  }).join('');
}

// ─── Render scenario (step-based) ────────────────────────────────────────────
// Step 0: Intro only  →  button "Continue to Setup"
// Step 1: Setup only  →  button "I'm ready — reveal resolutions"
// Step 2: Resolutions (choose one) → outcome + next scenario
function renderSc(){
  const s=SC[curSc], sel=chosen[s.id];
  const prog=Math.round(Object.keys(chosen).length/SC.length*100);
  const L=lang;

  const introLabel = L==='zh' ? '场景导言' : 'Scenario Introduction';
  const srcLabel   = L==='zh' ? '官方文本 — Campaign Guide PDF 中文译本' : 'Official Text — Campaign Guide PDF';
  const setupLabel = L==='zh' ? '场景布置' : 'Setup';
  const resLabel   = L==='zh' ? '结局 — 场景结束前请勿阅读' : 'Resolutions — DO NOT READ until end of scenario';
  const recLabel   = L==='zh' ? '已记录' : 'Recorded';
  const nextTxt    = L==='zh' ? '前往下一场景 →' : 'Next Scenario →';
  const doneTxt    = L==='zh' ? '战役完结。' : 'Campaign complete.';
  const progLabel  = L==='zh' ? `战役进度 — ${prog}%` : `Campaign Progress — ${prog}%`;


  // Step indicator dots
  const stepNames = L==='zh' ? ['导言','布置','结局'] : ['Intro','Setup','Resolutions'];
  const stepDots = stepNames.map((n,i)=>`
    <span style="display:inline-flex;align-items:center;gap:5px;font-family:'Cinzel',serif;font-size:10px;
      color:${i<=scStep?'var(--red)':'var(--muted)'};letter-spacing:.5px;">
      <span style="width:8px;height:8px;border-radius:50%;background:${i<=scStep?'var(--red)':'var(--bdr)'};flex-shrink:0"></span>
      ${n}
    </span>`).join('<span style="color:var(--bdr);margin:0 4px">—</span>');

  let body = '';

  if(scStep===0){
    // ── Step 0: Intro ──
    const contTxt = L==='zh' ? '继续至场景布置 →' : 'Continue to Setup →';
    body = `
      <div class="slabel">${introLabel}</div>
      <div class="official-block">
        <div class="official-label">◆ ${srcLabel}</div>
        <div class="official-text">${fmtIntro(s.intro[L], s.id)}</div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:.5rem">
        <button class="nbtn" onclick="nextStep()">${contTxt}</button>
      </div>`;

  } else if(scStep===1){
    // ── Step 1: Setup ──
    const contTxt = L==='zh' ? '场景开始，揭示结局 →' : 'Start scenario — reveal resolutions →';
    body = `
      <div class="slabel">${setupLabel}</div>
      <div class="setup-box"><ul>${s.setup[L].map(x=>{
      if(x.startsWith('<enc-list>')){
        const sets=x.replace('<enc-list>','').replace('</enc-list>','').split(',');
        const prefix=L==='zh'?'收集以下遭遇集：':'Gather encounter sets:';
        const badges=sets.map(s=>{
          const[key,en,zh]=s.split('|');
          const img=ENC_ICONS[key]?`<img src="${ENC_ICONS[key]}" class="enc-img" alt="${en}">`:'';
          const name=L==='zh'?`<span class="enc-name">${en}</span><span class="enc-zh"> ${zh}</span>`:`<span class="enc-name">${en}</span>`;
          return`<span class="enc">${img}${name}</span>`;
        }).join('');
        return`<li>${prefix}<div class="enc-sets">${badges}</div></li>`;
      }
      return`<li>${x}</li>`;
    }).join('')}</ul></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.5rem;flex-wrap:wrap;gap:8px">
        <button class="play-btn" onclick="prevStep()">← <span style="margin-left:3px">${L==='zh'?'返回导言':'Back to Intro'}</span></button>
        <button class="nbtn" onclick="nextStep()">${contTxt}</button>
      </div>`;

  } else {
    // ── Step 2: Resolutions ──
    body = `
      <div class="csec">
        <div class="slabel">${resLabel}</div>
        <div class="clist">
          ${s.choices.map(c=>`
            <button class="cbtn ${sel===c.id?'sel':''}" onclick="selectChoice('${s.id}','${c.id}')">
              <div class="cid">${sel===c.id ? "✓ " : ""}${c.tag[L]}</div>
              <div class="cnarr">${c.narr[L]}</div>
              <div class="ceff"><ul>${c.effects[L].map(e=>`<li>${e}</li>`).join('')}</ul></div>
            </button>`).join('')}
        </div>
      </div>
      ${sel && curSc<SC.length-1?`<div style="margin-top:1rem;display:flex;justify-content:flex-end"><button class="nbtn" onclick="gotoSc(${curSc+1})">${nextTxt}</button></div>`:''}
      ${sel && curSc===SC.length-1?`<div style="margin-top:1rem;font-size:13px;color:var(--gold);font-style:italic;text-align:right">${doneTxt}</div>`:''}
      <div style="margin-top:.8rem">
        <button class="play-btn" onclick="prevStep()">← <span style="margin-left:3px">${L==='zh'?'返回布置':'Back to Setup'}</span></button>
      </div>`;
  }

  // TTS only relevant for intro step
  const ttsBlock = '';

  const h=`<div class="pbwrap">
    <div class="pblabel">${progLabel}</div>
    <div class="pb"><div class="pbf" style="width:${prog}%"></div></div>
  </div>
  <div class="scard">
    <div class="stitle">${s.title[L]}</div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:1rem;flex-wrap:wrap">${stepDots}</div>
    ${body}
  </div>`;
  document.getElementById('sc-content').innerHTML=h;
}

function nextStep(){ if(scStep<2){scStep++;renderSc();window.scrollTo(0,0);} }
function prevStep(){ if(scStep>0){scStep--;renderSc();window.scrollTo(0,0);} }

// ─── Resolution select ────────────────────────────────────────────────────────
function selectChoice(sid,cid){
  chosen[sid]=cid;
  scStep=2;
  const s=SC.find(s=>s.id===sid),c=s.choices.find(c=>c.id===cid);
  autoLog(`[${s.title[lang]}] ${c.tag[lang]}`,'e');
  c.effects[lang].forEach(e=>autoLog('  → '+e,'n'));
  renderNav();renderSc();
}

// ─── Log ─────────────────────────────────────────────────────────────────────
function autoLog(txt,cat){
  const now=new Date();
  logs.unshift({txt,cat,time:now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
  renderLog();
}
function addLog(){
  const inp=document.getElementById('linput'),cat=document.getElementById('lcat').value,txt=inp.value.trim();
  if(!txt)return;autoLog(txt,cat);inp.value='';
}
function delLog(i){logs.splice(i,1);renderLog();}
const CL={c:'bc',e:'be',ch:'bch',n:'bn'};
const CN={en:{c:'Clue',e:'Event',ch:'Chaos',n:'Note'},zh:{c:'线索',e:'事件',ch:'混乱',n:'备注'}};
function renderLog(){
  const el=document.getElementById('llist');
  const empty = lang==='zh' ? '尚无日志记录。选择结局或手动添加！' : 'No entries yet. Select a resolution or add a note!';
  if(!logs.length){el.innerHTML=`<div class="elog">${empty}</div>`;return;}
  el.innerHTML=logs.map((l,i)=>`<div class="lentry">
    <div class="letxt"><span class="lbadge ${CL[l.cat]||'bn'}">${CN[lang][l.cat]||l.cat}</span>${l.txt}</div>
    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
      <span class="lemeta">${l.time}</span>
      <button class="ldel" onclick="delLog(${i})">✕</button>
    </div>
  </div>`).join('');
}

// ─── Chaos bag ────────────────────────────────────────────────────────────────
function setBag(k){
  currentBag=k;
  const cbag=document.getElementById('cbag');
  if(cbag) cbag.innerHTML=BAGS[k].map(t=>`<span class="tk ${t.c==='s'?'s':t.c==='n'?'n':t.c==='a'?'a':''}">${t.t}</span>`).join('');
  const bnote=document.getElementById('bag-note');
  if(bnote) bnote.textContent=BAG_NOTES[lang][k]||'';
}

// ─── Campaign notes ───────────────────────────────────────────────────────────
function renderNotes(){
  document.getElementById('cnotes').innerHTML=NOTES.map(n=>`
    <div class="cnote ${notesState[n.id]?'checked':''}" id="cnrow-${n.id}">
      <input type="checkbox" id="cn-${n.id}" ${notesState[n.id]?'checked':''} onchange="toggleNote('${n.id}')">
      <label for="cn-${n.id}">${n[lang]}</label>
    </div>`).join('');
}
function toggleNote(id){
  notesState[id]=!notesState[id];
  document.getElementById('cnrow-'+id)?.classList.toggle('checked',notesState[id]);
}

// ─── Experience ───────────────────────────────────────────────────────────────
function renderExp(){
  const labels = lang==='zh'
    ? ['玩家一','玩家二','玩家三','玩家四']
    : ['Player 1','Player 2','Player 3','Player 4'];
  const xpLabel = lang==='zh' ? '未使用经验值' : 'XP unspent';
  document.getElementById('exp-tracker').innerHTML=labels.map((p,i)=>`
    <div class="exp-row">
      <span class="exp-label">${p}</span>
      <button class="exp-btn" onclick="changeExp(${i},-1)">−</button>
      <span class="exp-num" id="exp-${i}">${expState['p'+(i+1)]||0}</span>
      <button class="exp-btn" onclick="changeExp(${i},+1)">+</button>
      <span style="font-size:12px;color:var(--muted)">${xpLabel}</span>
    </div>`).join('');
}
function changeExp(pi,d){
  const k='p'+(pi+1);expState[k]=Math.max(0,(expState[k]||0)+d);
  const el=document.getElementById('exp-'+pi);if(el)el.textContent=expState[k];
}

// ─── Outcomes ─────────────────────────────────────────────────────────────────
function renderOutcomes(){
  const el=document.getElementById('camp-outcomes');if(!el)return;
  const none = lang==='zh' ? '尚未记录任何结局。' : 'No outcomes recorded yet.';
  if(!Object.keys(chosen).length){
    el.innerHTML=`<div style="font-size:13px;color:var(--muted);padding:.5rem 0">${none}</div>`;return;
  }
  el.innerHTML=SC.map(s=>{
    const sel=chosen[s.id],c=sel?s.choices.find(x=>x.id===sel):null;
    const notDone = lang==='zh' ? '尚未完成' : 'Not completed';
    return`<div class="or">
      <span style="font-family:'Cinzel',serif;font-size:11px;color:var(--gold);min-width:80px;padding-top:2px;flex-shrink:0">${s.label[lang]}</span>
      <div>
        <div style="font-size:13px;color:${sel?'var(--ok)':'var(--muted)'}">${sel?c.tag[lang]:notDone}</div>
        ${sel?`<div style="font-size:12px;color:var(--muted);margin-top:3px">${c.effects[lang][0]}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ─── TTS ──────────────────────────────────────────────────────────────────────
function getTTSText(){
  const s=SC[curSc];
  if(s.id === 'sc2'){
    // Same conditional logic as fmtSc2Intro — strip to plain text
    const litaAlone = notesState['lita_alone'];
    const txt = s.intro[lang];
    const isEn = lang === 'en';
    const intro1Marker = isEn ? 'Intro 1:' : '导言一：';
    const intro2Marker = isEn ? 'Intro 2:' : '导言二：';
    const intro3Marker = isEn ? 'Intro 3' : '导言三';
    const paras = txt.split(/\n\n|\\n\\n/).map(p=>p.trim()).filter(Boolean);
    let sections = {intro1:[], intro2:[], intro3:[]};
    let cur = 'pre';
    for(const p of paras){
      if(p.startsWith('[')||p.startsWith('【')) continue;
      if(p.startsWith(intro1Marker)) cur='intro1';
      else if(p.startsWith(intro2Marker)) cur='intro2';
      else if(p.startsWith(intro3Marker)) cur='intro3';
      if(cur !== 'pre') sections[cur].push(p);
    }
    const chosen = litaAlone ? sections.intro1 : sections.intro2;
    return [...chosen, ...sections.intro3].join(' ');
  }
  return s.intro[lang];
}


// ─── Init ─────────────────────────────────────────────────────────────────────
renderNav();renderSc();renderLog();
