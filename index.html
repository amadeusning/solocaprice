<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0f;
    --surface: #131318;
    --surface2: #1a1a22;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.15);
    --text: #e8e8f0;
    --text-mid: #8888a0;
    --text-dim: #44445a;
    --accent: #7c6af7;
    --accent2: #f76a6a;
    --accent3: #6af7c8;
    --glow: rgba(124,106,247,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: 0.6;
  }

  /* Ambient glow blobs */
  .glow-blob {
    position: fixed; border-radius: 50%;
    filter: blur(120px); pointer-events: none; z-index: 0;
  }
  .glow-blob-1 { width: 600px; height: 600px; background: rgba(124,106,247,0.06); top: -200px; right: -100px; }
  .glow-blob-2 { width: 400px; height: 400px; background: rgba(106,247,200,0.04); bottom: 100px; left: -100px; }

  /* Layout */
  .container {
    position: relative; z-index: 1;
    max-width: 900px; margin: 0 auto;
    padding: 0 24px;
  }

  /* Header */
  header {
    padding: 80px 0 60px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 60px;
  }

  .header-inner {
    display: flex; align-items: flex-end;
    justify-content: space-between; gap: 24px;
    flex-wrap: wrap;
  }

  .site-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem; letter-spacing: 3px;
    color: var(--accent); text-transform: uppercase;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .site-label::before {
    content: '';
    display: inline-block; width: 20px; height: 1px;
    background: var(--accent);
  }

  .site-title {
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    color: var(--text);
  }
  .site-title span {
    color: transparent;
    -webkit-text-stroke: 1px rgba(255,255,255,0.25);
  }

  .site-desc {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-mid);
    line-height: 1.7;
    max-width: 280px;
    text-align: right;
  }

  /* Stats bar */
  .stats-bar {
    display: flex; gap: 32px;
    padding: 24px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 60px;
  }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat-num {
    font-size: 1.6rem; font-weight: 700;
    color: var(--text); letter-spacing: -1px;
  }
  .stat-lbl {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 2px;
  }

  /* Section title */
  .section-head {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 28px;
  }
  .section-head h2 {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem; letter-spacing: 3px;
    color: var(--text-dim); text-transform: uppercase;
  }
  .section-head::after {
    content: ''; flex: 1; height: 1px;
    background: var(--border);
  }

  /* Tool grid */
  .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 80px;
  }

  /* Tool card */
  .tool-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    text-decoration: none;
    color: inherit;
    display: flex; flex-direction: column; gap: 16px;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    overflow: hidden;
    cursor: pointer;
  }
  .tool-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--glow), transparent 60%);
    opacity: 0; transition: opacity 0.3s;
  }
  .tool-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-3px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(124,106,247,0.1);
  }
  .tool-card:hover::before { opacity: 1; }

  .tool-card-top {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 12px;
  }

  .tool-icon-wrap {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    flex-shrink: 0;
  }

  .tool-arrow {
    font-family: 'DM Mono', monospace;
    font-size: 1rem; color: var(--text-dim);
    transition: color 0.2s, transform 0.2s;
    margin-top: 2px;
  }
  .tool-card:hover .tool-arrow { color: var(--accent); transform: translate(3px, -3px); }

  .tool-tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem; letter-spacing: 2px;
    text-transform: uppercase;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid;
  }

  .tool-name {
    font-size: 1.15rem; font-weight: 700;
    letter-spacing: -0.3px;
    line-height: 1.2;
  }

  .tool-desc {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem; color: var(--text-mid);
    line-height: 1.7; flex: 1;
  }

  .tool-meta {
    display: flex; align-items: center;
    justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .tool-tech {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .tech-badge {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem; color: var(--text-dim);
    background: var(--surface2);
    padding: 3px 7px; border-radius: 4px;
    letter-spacing: 1px;
  }
  .tool-status {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem; color: var(--accent3);
    display: flex; align-items: center; gap: 5px;
  }
  .tool-status::before {
    content: '';
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent3);
    box-shadow: 0 0 6px var(--accent3);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Color themes per card */
  .theme-purple .tool-icon-wrap { background: rgba(124,106,247,0.12); }
  .theme-purple .tool-tag { color: var(--accent); border-color: rgba(124,106,247,0.25); background: rgba(124,106,247,0.07); }

  .theme-red .tool-icon-wrap { background: rgba(247,106,106,0.12); }
  .theme-red .tool-tag { color: var(--accent2); border-color: rgba(247,106,106,0.25); background: rgba(247,106,106,0.07); }

  .theme-green .tool-icon-wrap { background: rgba(106,247,200,0.1); }
  .theme-green .tool-tag { color: var(--accent3); border-color: rgba(106,247,200,0.2); background: rgba(106,247,200,0.06); }

  /* Coming soon card */
  .tool-card.coming-soon {
    opacity: 0.45; cursor: default;
    background: repeating-linear-gradient(
      -45deg,
      var(--surface),
      var(--surface) 8px,
      var(--bg) 8px,
      var(--bg) 16px
    );
  }
  .tool-card.coming-soon:hover { transform: none; box-shadow: none; border-color: var(--border); }
  .tool-card.coming-soon:hover::before { opacity: 0; }
  .tool-card.coming-soon .tool-status::before { background: var(--text-dim); box-shadow: none; animation: none; }
  .tool-card.coming-soon .tool-status { color: var(--text-dim); }

  /* Footer */
  footer {
    border-top: 1px solid var(--border);
    padding: 32px 0 48px;
    display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .footer-text {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem; color: var(--text-dim);
    letter-spacing: 1px;
  }
  .footer-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--text-dim); display: inline-block;
    margin: 0 8px; vertical-align: middle;
  }

  /* Page load animation */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  header { animation: fadeUp 0.5s ease both; }
  .stats-bar { animation: fadeUp 0.5s 0.1s ease both; }
  .section-head { animation: fadeUp 0.5s 0.15s ease both; }
  .tool-card:nth-child(1) { animation: fadeUp 0.5s 0.2s ease both; }
  .tool-card:nth-child(2) { animation: fadeUp 0.5s 0.28s ease both; }
  .tool-card:nth-child(3) { animation: fadeUp 0.5s 0.36s ease both; }

  @media (max-width: 600px) {
    header { padding: 48px 0 36px; margin-bottom: 36px; }
    .header-inner { flex-direction: column; align-items: flex-start; }
    .site-desc { text-align: left; max-width: 100%; }
    .stats-bar { gap: 20px; margin-bottom: 40px; }
    .tool-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="glow-blob glow-blob-1"></div>
<div class="glow-blob glow-blob-2"></div>

<div class="container">

  <header>
    <div class="header-inner">
      <div>
        <div class="site-label">Personal Tools</div>
        <h1 class="site-title">Made<br><span>for fun</span></h1>
      </div>
      <p class="site-desc">
        小工具集合<br>
        用 HTML + JS 做的<br>
        全部免费开放使用
      </p>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat">
      <span class="stat-num" id="toolCount">1</span>
      <span class="stat-lbl">Tools</span>
    </div>
    <div class="stat">
      <span class="stat-num">100%</span>
      <span class="stat-lbl">Free</span>
    </div>
    <div class="stat">
      <span class="stat-num">0</span>
      <span class="stat-lbl">Tracking</span>
    </div>
  </div>

  <div class="section-head">
    <h2>All Tools</h2>
  </div>

  <div class="tool-grid">

    <!-- Wingspan -->
    <a class="tool-card theme-purple" href="wingspan/">
      <div class="tool-card-top">
        <div class="tool-icon-wrap">🦜</div>
        <span class="tool-arrow">↗</span>
      </div>
      <div>
        <div class="tool-tag">Board Game</div>
        <div style="height:8px"></div>
        <div class="tool-name">Wingspan · Oceania<br>计分器</div>
      </div>
      <div class="tool-desc">
        终局计分工具。支持花蜜栖息地对比（5/2分制）、历史记录、胜场排行榜。1–5名玩家。
      </div>
      <div class="tool-meta">
        <div class="tool-tech">
          <span class="tech-badge">HTML</span>
          <span class="tech-badge">LocalStorage</span>
        </div>
        <div class="tool-status">Live</div>
      </div>
    </a>

    <!-- Placeholder: more tools -->
    <div class="tool-card coming-soon theme-red">
      <div class="tool-card-top">
        <div class="tool-icon-wrap">🎵</div>
        <span class="tool-arrow">—</span>
      </div>
      <div>
        <div class="tool-tag">Music</div>
        <div style="height:8px"></div>
        <div class="tool-name">下一个工具</div>
      </div>
      <div class="tool-desc">
        即将上线
      </div>
      <div class="tool-meta">
        <div class="tool-tech">
          <span class="tech-badge">WIP</span>
        </div>
        <div class="tool-status">Coming soon</div>
      </div>
    </div>

  </div>

  <footer>
    <span class="footer-text">
      Personal tools
      <span class="footer-dot"></span>
      No cookies
      <span class="footer-dot"></span>
      No tracking
    </span>
    <span class="footer-text" id="footerYear"></span>
  </footer>

</div>

<script>
  document.getElementById('footerYear').textContent = new Date().getFullYear();
</script>
</body>
</html>
